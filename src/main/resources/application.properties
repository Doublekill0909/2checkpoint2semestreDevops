spring.application.name=dimdim

# =====================================================================
# Datasource - tudo vem de variavel de ambiente. Sem segredo no codigo.
#
# No App Service as tres variaveis sao app settings criadas pelo
# scripts/04-webapp.sh. A aplicacao conecta com o usuario de minimo
# privilegio (APP_DB_USER do .env), e nunca com o administrador do servidor.
# =====================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# O scripts/script_bd.sql e a FONTE DA VERDADE do schema. Com "validate" o
# Hibernate confere tabelas, colunas e tipos na subida e recusa iniciar se o
# banco divergir das entidades. Nunca use "update" ou "create" na entrega.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
# Colunas de texto sao NVARCHAR (Unicode), por causa de nomes com acento.
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# HikariCP. O Azure SQL Basic aceita no maximo 30 sessoes simultaneas, entao
# o pool e pequeno. O max-lifetime fica abaixo dos 30 min em que o gateway
# do Azure SQL derruba conexoes ociosas.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.keepalive-time=300000

# =====================================================================
# Web
# =====================================================================
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
# Paginas de erro genericas nao expoem mensagem nem stack trace de excecao,
# que poderiam revelar detalhes internos (SQL, nomes de classes).
server.error.include-message=never
server.error.include-stacktrace=never

# Actuator: so o health fica exposto, sem detalhes, para conferir app + banco
# depois do deploy (https://<app>.azurewebsites.net/actuator/health).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Logs vao para o console (Log stream do App Service) e, pelo agente do
# Application Insights, para a tabela traces.
logging.level.fiap.dimdim=INFO
