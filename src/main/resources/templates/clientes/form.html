<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${clienteId} ? 'Editar cliente' : 'Cadastrar cliente')}"></head>
<body>
<header th:replace="~{fragments/layout :: topo('clientes')}"></header>

<main class="pagina pagina--estreita">
    <a class="voltar" th:href="${clienteId} ? @{/clientes/{id}(id=${clienteId})} : @{/clientes}">Voltar</a>
    <h1 th:text="${clienteId} ? 'Editar cliente' : 'Cadastrar cliente'">Cadastrar cliente</h1>

    <form class="formulario" method="post" novalidate th:object="${cliente}"
          th:action="${clienteId} ? @{/clientes/{id}(id=${clienteId})} : @{/clientes}">

        <div class="alerta alerta--erro" th:if="${#fields.hasGlobalErrors()}" role="alert">
            <p th:each="mensagem : ${#fields.globalErrors()}" th:text="${mensagem}">Erro geral.</p>
        </div>

        <div class="campo" th:classappend="${#fields.hasErrors('nome')} ? 'campo--erro'">
            <label for="nome">Nome completo</label>
            <input id="nome" type="text" th:field="*{nome}" maxlength="120" autocomplete="name" required>
            <p class="campo__erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Erro no nome.</p>
        </div>

        <div class="campo" th:classappend="${#fields.hasErrors('cpf')} ? 'campo--erro'">
            <label for="cpf">CPF</label>
            <input id="cpf" type="text" th:field="*{cpf}" inputmode="numeric" maxlength="14"
                   placeholder="000.000.000-00" required>
            <p class="campo__ajuda">Pode digitar com ou sem pontuação; o banco guarda só os 11 dígitos.</p>
            <p class="campo__erro" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}">Erro no CPF.</p>
        </div>

        <div class="campo" th:classappend="${#fields.hasErrors('email')} ? 'campo--erro'">
            <label for="email">E-mail</label>
            <input id="email" type="email" th:field="*{email}" maxlength="120" autocomplete="email" required>
            <p class="campo__erro" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Erro no e-mail.</p>
        </div>

        <div class="campo" th:classappend="${#fields.hasErrors('telefone')} ? 'campo--erro'">
            <label for="telefone">Telefone <span class="opcional">(opcional)</span></label>
            <input id="telefone" type="tel" th:field="*{telefone}" maxlength="20" autocomplete="tel"
                   placeholder="(11) 91234-5678">
            <p class="campo__erro" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}">Erro no telefone.</p>
        </div>

        <div class="campo" th:classappend="${#fields.hasErrors('dataNascimento')} ? 'campo--erro'">
            <label for="dataNascimento">Data de nascimento</label>
            <input id="dataNascimento" type="date" th:field="*{dataNascimento}" required>
            <p class="campo__erro" th:if="${#fields.hasErrors('dataNascimento')}" th:errors="*{dataNascimento}">Erro na data.</p>
        </div>

        <div class="formulario__acoes">
            <button type="submit" class="botao botao--primario"
                    th:text="${clienteId} ? 'Salvar alterações' : 'Cadastrar cliente'">Cadastrar cliente</button>
            <a class="botao" th:href="${clienteId} ? @{/clientes/{id}(id=${clienteId})} : @{/clientes}">Cancelar</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
