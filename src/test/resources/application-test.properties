# =====================================================================
# Perfil "test": usado SOMENTE pelos testes automatizados do pipeline.
#
# O H2 em memoria substitui o Azure SQL apenas aqui, para que o build no
# GitHub Actions rode sem depender de um banco na nuvem. O schema e gerado
# pelo Hibernate a partir das entidades; o alinhamento entre as entidades e
# o scripts/script_bd.sql e conferido pelo ScriptBdTest.
# =====================================================================
spring.datasource.url=jdbc:h2:mem:dimdim;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
